publish_to: none

name: rsi_widget
description: RSI Widget App - mobile application for RSI alerts and widgets
version: 1.0.3+3

environment:
  sdk: ">=3.7.0 <4.0.0"  # isar_db requires Dart 3.7+

dependencies:
  flutter:
    sdk: flutter
  
  flutter_localizations:
    sdk: flutter

  # Local notifications
  flutter_local_notifications: ^19.5.0
  
  # Firebase
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  firebase_auth: ^6.1.2
  google_sign_in: ^6.2.1
  
  # HTTP client
  http: ^1.2.2
  
  # Local database - isar_db fork with 16KB page size support (Android 15)
  isar_db: ^1.0.1
  isar_db_flutter_libs: ^1.0.0
  
  # Serialization
  freezed_annotation: ^2.4.1
  
  # Charts
  fl_chart: ^1.1.1
  
  # Utilities
  get_it: ^8.0.3
  url_launcher: ^6.3.0
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  path_provider: ^2.1.3
  app_settings: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  # Code generation (isar_db has built-in generator)
  build_runner: ^2.4.13
  freezed: ^2.4.7
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "INDICHARTS.png"
  min_sdk_android: 21
  remove_alpha_ios: true
